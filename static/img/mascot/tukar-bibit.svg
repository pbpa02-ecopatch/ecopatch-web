<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="mascotTitle">
  <title id="mascotTitle">Maskot EcoPatch pose tukar bibit</title>
  <defs>
    <radialGradient id="tbBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#EAF8E7"/>
      <stop offset="100%" stop-color="#D9F1D8"/>
    </radialGradient>
    <linearGradient id="tbPot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7A94A"/>
      <stop offset="100%" stop-color="#ED8A2B"/>
    </linearGradient>
    <linearGradient id="tbRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A5836"/>
      <stop offset="100%" stop-color="#6F4527"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="126" r="98" fill="url(#tbBg)"/>

  <!-- sparkles -->
  <path d="M46 96l3.4 8.6L58 108l-8.6 3.4L46 120l-3.4-8.6L34 108l8.6-3.4Z" fill="#8EDCE8" opacity=".85"/>
  <path d="M196 150l2.3 5.7 5.7 2.3-5.7 2.3-2.3 5.7-2.3-5.7-5.7-2.3 5.7-2.3Z" fill="#FFC94D" opacity=".9"/>

  <!-- leaves -->
  <path d="M120 100V54" stroke="#2FA34A" stroke-width="7" stroke-linecap="round"/>
  <path d="M119 82C104 76 82 68 66 44c20-12 47 8 53 38Z" fill="#43BE5C"/>
  <path d="M117 79c-11-11-24-19-37-26" stroke="#2E9E45" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".5"/>
  <path d="M121 78C130 56 150 38 176 32c8 26-14 48-55 46Z" fill="#37AD4F"/>
  <path d="M126 74c12-11 26-18 38-22" stroke="#2E9E45" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".5"/>

  <!-- left arm -->
  <path d="M66 150c-13 2-22 9-26 20" stroke="#F2A03F" stroke-width="15" stroke-linecap="round" fill="none"/>
  <circle cx="39" cy="172" r="8.5" fill="#F7B25C"/>

  <!-- feet -->
  <ellipse cx="86" cy="198" rx="15" ry="8" fill="#E4821F"/>
  <ellipse cx="154" cy="198" rx="15" ry="8" fill="#E4821F"/>

  <!-- pot body -->
  <rect x="58" y="112" width="124" height="84" rx="24" fill="url(#tbPot)"/>
  <rect x="58" y="112" width="124" height="84" rx="24" fill="none" stroke="#DE7A1B" stroke-width="2" opacity=".45"/>
  <rect x="47" y="96" width="146" height="28" rx="13" fill="url(#tbRim)"/>
  <rect x="55" y="102" width="130" height="7" rx="3.5" fill="#FFFFFF" opacity=".12"/>

  <!-- face -->
  <ellipse cx="99" cy="148" rx="9" ry="10.5" fill="#2E2A26"/>
  <ellipse cx="141" cy="148" rx="9" ry="10.5" fill="#2E2A26"/>
  <circle cx="102" cy="144" r="3.2" fill="#FFFFFF"/>
  <circle cx="144" cy="144" r="3.2" fill="#FFFFFF"/>
  <ellipse cx="79" cy="163" rx="10" ry="6" fill="#F58FA6" opacity=".8"/>
  <ellipse cx="161" cy="163" rx="10" ry="6" fill="#F58FA6" opacity=".8"/>
  <path d="M108 160c2 8 7 12 12 12s10-4 12-12Z" fill="#5A3320"/>
  <path d="M114 169c2 3 4 4 6 4s4-1 6-4Z" fill="#F0708E"/>

  <!-- right arm holding the seed packet -->
  <path d="M176 142c11-8 16-20 16-32" stroke="#F2A03F" stroke-width="15" stroke-linecap="round" fill="none"/>
  <circle cx="192" cy="107" r="8.5" fill="#F7B25C"/>

  <!-- seed packet -->
  <g transform="rotate(18 196 72)">
    <rect x="178" y="44" width="38" height="50" rx="7" fill="#FFFDF3" stroke="#CDBB9C" stroke-width="1.8"/>
    <rect x="184" y="51" width="26" height="19" rx="4" fill="#EAF6E4" stroke="#BFD9B4" stroke-width="1.2"/>
    <path d="M197 65c-5-1-8-4-8-8 5-1 8 2 8 8Z" fill="#3FAE55"/>
    <path d="M197 65c5-1 8-4 8-8-5-1-8 2-8 8Z" fill="#2E9E45"/>
    <path d="M197 65v4" stroke="#2E9E45" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M185 78h24M185 85h17" stroke="#D9CBB2" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- leaf badge on the pot -->
  <g transform="rotate(-8 158 176)">
    <rect x="145" y="163" width="27" height="27" rx="6" fill="#FFFDF3" stroke="#38B24E" stroke-width="1.6"/>
    <path d="M158 184c-6-1-9-5-9-9 6-1 9 3 9 9Z" fill="#3FAE55"/>
    <path d="M158 184c6-1 9-5 9-9-6-1-9 3-9 9Z" fill="#2E9E45"/>
  </g>
</svg>
