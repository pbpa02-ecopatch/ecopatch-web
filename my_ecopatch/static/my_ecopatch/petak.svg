<svg xmlns="http://www.w3.org/2000/svg" class="pet"  viewBox="-10 -10 420 410" role="img" aria-label="Petak senang" style="display:block">
<style>
  .mep-pet-body { animation: mep-breathe 3.8s ease-in-out infinite; }
  .p-sprout { transform-box: fill-box; transform-origin: 50% 100%; animation: mep-sway 3.2s ease-in-out infinite; }
  .p-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: mep-blink 4.8s infinite; }
  @keyframes mep-breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes mep-sway { 0%, 100% { transform: rotate(-2.6deg); } 50% { transform: rotate(2.6deg); } }
  @keyframes mep-blink { 0%, 91%, 100% { transform: scaleY(1); } 94.5% { transform: scaleY(.08); } }
  @media (prefers-reduced-motion: reduce) { .mep-pet-body, .p-sprout, .p-eyes { animation: none; } }
</style>
