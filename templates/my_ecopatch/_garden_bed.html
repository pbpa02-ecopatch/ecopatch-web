<div class="mep-bed mep-bed--{{ patch.space_type }}" aria-hidden="true">
<div class="mep-bed-plants">
{% for plant in patch.preview_plants %}
<svg class="mep-sprout mep-sprout--{{ plant.status }}" viewBox="0 0 64 64"><circle class="mep-pot" cx="32" cy="35" r="23"/><path class="mep-leaf" d="M32 36C5 40 5 14 13 12C30 10 34 25 32 36ZM32 36C31 11 50 8 54 16C56 31 45 38 32 36ZM32 36C53 31 59 47 50 53C36 57 30 48 32 36ZM32 36C35 58 13 59 11 50C9 40 20 33 32 36Z"/><path d="M32 46V27" stroke="#195d32" stroke-width="3" stroke-linecap="round"/>{% if plant.status == 'harvested' %}<circle cx="49" cy="13" r="10" fill="#ff9d2e"/><path d="m44 13 4 4 6-8" fill="none" stroke="#593600" stroke-width="2"/>{% endif %}</svg>
{% empty %}<span class="mep-bed-empty">Ruang untuk<br>tumbuh</span>{% endfor %}
</div>{% if patch.plant_total > 9 %}<span class="mep-bed-more">+{{ patch.plant_total|add:"-9" }} entri</span>{% endif %}
</div>
