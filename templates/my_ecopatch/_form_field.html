<div class="patch-field{% if field.errors %} has-error{% endif %}">
    <label class="patch-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="patch-required" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="patch-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<ul class="patch-error" id="{{ field.auto_id }}_error" role="alert">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
