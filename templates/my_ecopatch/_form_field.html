<div class="patch-field{% if field.errors %} has-error{% endif %}">
    <label class="patch-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="patch-help">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="patch-error">{{ error }}</p>{% endfor %}
</div>
