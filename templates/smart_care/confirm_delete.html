{% extends "base.html" %}
{% block title %}Delete Task — Smart Care{% endblock %}
{% block content %}
<h2>Delete Task</h2>
<p>Are you sure you want to delete "{{ task.get_task_type_display }} - {{ task.due_date }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'smart_care:detail' task.id %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
