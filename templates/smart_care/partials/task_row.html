<div id="task-{{ task.id }}" class="list-group-item d-flex justify-content-between align-items-center">
    <div class="form-check">
        <input
            class="form-check-input"
            type="checkbox"
            {% if task.is_completed %}checked disabled{% endif %}
            hx-post="{% url 'smart_care:complete' task.id %}"
            hx-target="#task-{{ task.id }}"
            hx-swap="outerHTML"
            {% if task.is_completed %}disabled{% endif %}
        >
        <label class="form-check-label {% if task.is_completed %}text-decoration-line-through text-muted{% endif %}">
            {{ task.get_task_type_display }} &mdash; due {{ task.due_date }}
        </label>
    </div>
    <div>
        <a href="{% url 'smart_care:detail' task.id %}" class="btn btn-sm btn-outline-secondary">Detail</a>
    </div>
</div>
