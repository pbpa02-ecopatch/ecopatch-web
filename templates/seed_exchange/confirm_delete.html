{% extends "base.html" %}
{% block title %}Hapus {{ listing.title }} - Seed Exchange{% endblock %}

{% block content %}
<div class="card p-4 mx-auto" style="max-width: 560px;">
    <h1 class="h4">Hapus listing ini?</h1>
    <p class="text-muted">"{{ listing.title }}" ({{ listing.city }}) akan dihapus permanen.</p>
    <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Ya, hapus</button>
        <a class="btn btn-outline-success" href="{% url 'seed_exchange:detail' listing.pk %}">Batal</a>
    </form>
</div>
{% endblock %}
