{% comment %}
  Guest login callout, reused by every Seed Exchange section and the detail
  page so the prompt looks the same everywhere.
  Expects: title, text, next_url.
{% endcomment %}
<div class="seed-login-hint" role="note">
    <span class="seed-login-hint-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21v-8"/>
            <path d="M12 13c0-4 3-7 7-7 0 4-3 7-7 7Z"/>
            <path d="M12 15c0-3-2.2-5-5-5 0 3 2.2 5 5 5Z"/>
            <path d="M5 21h14"/>
        </svg>
    </span>
    <div class="seed-login-hint-body">
        <p class="seed-login-hint-title">{{ title }}</p>
        <p class="seed-login-hint-text">{{ text }}</p>
    </div>
    <div class="seed-login-hint-actions">
        <a href="{% url 'main:login' %}?next={{ next_url }}" class="btn-seed-secondary">Masuk</a>
        <a href="{% url 'main:register' %}" class="btn-seed-primary">Daftar</a>
    </div>
</div>
