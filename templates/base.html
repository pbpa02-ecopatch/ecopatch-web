<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EcoPatch{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% load static %}{% static 'css/custom.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
    {% include "header.html" %}

    <main class="container flex-grow-1 py-4">
        {% block content %}{% endblock %}
    </main>

    {% if messages %}
        <div class="toast-container site-toasts" aria-live="polite">
            {% for message in messages %}
                <div class="toast site-toast site-toast--{% if message.level_tag == 'error' %}danger{% else %}{{ message.level_tag|default:'info' }}{% endif %}"
                     role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}" data-bs-delay="5000">
                    <div class="site-toast-body">{{ message }}</div>
                    <button type="button" class="btn-close site-toast-close" data-bs-dismiss="toast" aria-label="Tutup"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% include "footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/rellax/1.12.1/rellax.min.js"></script>
    <script>
        document.querySelectorAll('.site-toast').forEach(function (el) {
            bootstrap.Toast.getOrCreateInstance(el).show();
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
