<li class="care-task{% if task.is_completed %} is-done{% endif %}" id="task-{{ task.pk }}"
    data-plant="{{ task.plant_name }}" data-type="{{ task.task_type }}" data-outdoor="{{ task.is_outdoor|yesno:'1,0' }}"
    data-due="{{ task.due_date|date:'Y-m-d' }}" data-complete-url="{% url 'smart_care:complete' task.pk %}"{% if overdue %} data-overdue{% endif %}>
    <button type="button" class="care-check" aria-pressed="{{ task.is_completed|yesno:'true,false' }}"
            aria-label="Tandai {{ task.plant_name }} ({{ task.get_task_type_display }}) selesai">
        <svg class="care-check-svg" viewBox="0 0 28 28" aria-hidden="true">
            <circle class="care-check-ring" cx="14" cy="14" r="11"/>
            <path class="care-check-mark" d="m8.5 14.5 3.8 3.8 7.2-8"/>
        </svg>
    </button>
    <div class="care-task-body">
        <span class="care-task-name">{{ task.plant_name }}</span>
        <span class="care-task-meta">
            <span>{{ task.get_task_type_display }}</span>
            {% if overdue %}<span>{{ task.due_date|date:"j M" }}</span>{% endif %}
            {% if task.source == "suggested" %}<span class="care-tag">Saran</span>{% endif %}
            {% if not task.is_outdoor %}<span>Dalam ruangan</span>{% endif %}
        </span>
        {% if task.notes %}<span class="care-task-notes">{{ task.notes|truncatechars:90 }}</span>{% endif %}
        <span class="care-task-hint" hidden></span>
    </div>
    <div class="care-task-actions">
        <a href="{% url 'smart_care:update' task.pk %}" class="care-icon-btn" aria-label="Edit {{ task.plant_name }}"
           hx-get="{% url 'smart_care:update' task.pk %}" hx-target="#care-modal-content"
           data-bs-toggle="modal" data-bs-target="#care-modal">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </a>
        <button type="button" class="care-icon-btn care-icon-btn-danger" aria-label="Hapus {{ task.plant_name }}"
                data-delete-url="{% url 'smart_care:delete' task.pk %}"
                data-delete-name="{{ task.plant_name }} ({{ task.get_task_type_display }})">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
        </button>
    </div>
</li>
