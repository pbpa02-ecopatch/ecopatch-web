<svg xmlns="http://www.w3.org/2000/svg" class="seed-bibit"  viewBox="-10 -10 420 410" role="img" aria-label="Tukar Bibit, maskot Seed Exchange" style="display:block">
<style>  .tb-arm { transform-box: fill-box; }  .tb-arm--l { transform-origin: 96% 8%; animation: tb-wave-l 3.4s ease-in-out infinite; }  .tb-arm--r { transform-origin: 4% 8%; animation: tb-wave-r 3.9s ease-in-out infinite; }  .tb-frond { transform-box: view-box; animation: tb-sway 4.2s ease-in-out infinite; }  .tb-frond--1 { transform-origin: 152px 194px; animation-delay: -0.5s; }  .tb-frond--2 { transform-origin: 250px 194px; animation-delay: -2.1s; }  .tb-frond--3 { transform-origin: 200px 194px; animation-delay: -1.2s; }  .tb-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: tb-blink 4.8s infinite; }  .tb-gaze { transform-box: fill-box; animation: tb-gaze 6.5s ease-in-out infinite; }  .tb-packet { transform-box: fill-box; transform-origin: 50% 0%; animation: tb-packet 4s ease-in-out infinite; }  .tb-seeds { transform-box: fill-box; animation: tb-drift 6s ease-in-out infinite; }  @keyframes tb-wave-l { 0%, 100% { rotate: -5deg; } 50% { rotate: 5deg; } }  @keyframes tb-wave-r { 0%, 100% { rotate: 4deg; } 50% { rotate: -4deg; } }  @keyframes tb-sway { 0%, 100% { rotate: -2.4deg; } 50% { rotate: 2.4deg; } }  @keyframes tb-blink { 0%, 91%, 100% { transform: scaleY(1); } 94.5% { transform: scaleY(.08); } }  @keyframes tb-gaze { 0%, 100% { translate: 0 0; } 30% { translate: 2px 0; } 70% { translate: -2px 0; } }  @keyframes tb-packet { 0%, 100% { rotate: -2deg; } 50% { rotate: 3deg; } }  @keyframes tb-drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }  @media (prefers-reduced-motion: reduce) { .tb-arm, .tb-frond, .tb-eyes, .tb-gaze, .tb-packet, .tb-seeds { animation: none; } }</style>
