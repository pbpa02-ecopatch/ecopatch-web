<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" role="img" aria-label="Tukar Bibit melambai sambil memegang pot bibit">
<style>
    /* The whole character floats a little; the halo and the ground shadow stay put. */
    .m-float {
        transform-box: view-box;
        transform-origin: 240px 430px;
        animation: m-float 5.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    .m-halo {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: m-halo 7s ease-in-out infinite;
    }
    /* Waving arm: the pivot sits on the shoulder, the hand gets its own small delay. */
    .m-arm {
        transform-box: view-box;
        transform-origin: 112px 276px;
        animation: m-wave 2.9s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    .m-hand {
        transform-box: view-box;
        transform-origin: 78px 206px;
        animation: m-hand 2.9s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    .m-hold {
        transform-box: view-box;
        transform-origin: 414px 306px;
        animation: m-hold 3.8s ease-in-out infinite;
    }
    .m-leaf {
        transform-box: view-box;
        animation: m-sway 4.8s ease-in-out infinite;
    }
    .m-leaf--1 { transform-origin: 238px 132px; animation-delay: -0.5s; }
    .m-leaf--2 { transform-origin: 242px 132px; animation-delay: -2.3s; animation-duration: 5.4s; }
    .m-leaf--3 { transform-origin: 204px 210px; animation-delay: -1.4s; animation-duration: 5.8s; }
    .m-leaf--4 { transform-origin: 286px 210px; animation-delay: -3.2s; animation-duration: 4.2s; }
    .m-eye {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: m-blink 5.2s infinite;
    }
    .m-seed {
        transform-box: fill-box;
        animation: m-drift 7s ease-in-out infinite;
    }
    .m-seed--2 { animation-duration: 8.6s; animation-delay: -2.6s; }
    .m-seed--3 { animation-duration: 6.2s; animation-delay: -4.1s; }

    @keyframes m-float {
        0%, 100% { translate: 0 0; }
        50% { translate: 0 -7px; }
    }
    @keyframes m-halo {
        0%, 100% { scale: 1; opacity: 1; }
        50% { scale: 1.035; opacity: 0.82; }
    }
    @keyframes m-wave {
        0%, 100% { rotate: -4deg; }
        50% { rotate: 10deg; }
    }
    @keyframes m-hand {
        0%, 100% { rotate: -7deg; }
        50% { rotate: 7deg; }
    }
    @keyframes m-hold {
        0%, 100% { rotate: -1.8deg; }
        50% { rotate: 2deg; }
    }
    @keyframes m-sway {
        0%, 100% { rotate: -2.4deg; }
        50% { rotate: 2.6deg; }
    }
    @keyframes m-blink {
        0%, 92%, 100% { transform: scaleY(1); }
        95%, 96.5% { transform: scaleY(0.1); }
    }
    @keyframes m-drift {
        0%, 100% { translate: 0 0; opacity: 0.5; }
        50% { translate: 2px -11px; opacity: 0.95; }
    }

    @media (prefers-reduced-motion: reduce) {
        .m-float, .m-halo, .m-arm, .m-hand, .m-hold,
        .m-leaf, .m-eye, .m-seed { animation: none; }
    }
</style>

<defs>
    <clipPath id="m-mouth">
        <path d="M204 326c3 24 24 35 36 35s33-11 36-35z"/>
    </clipPath>
</defs>

<!-- soft green halo, exactly like the mascot sheet -->
<circle class="m-halo" cx="240" cy="238" r="198" fill="#e7f6e2"/>
<ellipse cx="240" cy="432" rx="130" ry="14" fill="#2b4a2e" opacity="0.13"/>

<g class="m-float">
    <!-- arms sit behind the pot, only the hands and the sleeve tips show -->
    <g class="m-arm">
        <path d="M112 276C92 252 82 228 76 204" stroke="#f7941e" stroke-width="31" fill="none" stroke-linecap="round"/>
        <path d="M112 276C92 252 82 228 76 204" stroke="#fbaf55" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.65" transform="translate(-4 -4)"/>
        <g class="m-hand">
            <circle cx="76" cy="190" r="21" fill="#f7941e"/>
            <circle cx="69" cy="182" r="6.5" fill="#fbaf55" opacity="0.8"/>
            <path d="M58 196c-7-3-10-9-8-15 6 1 10 6 10 12z" fill="#f7941e"/>
        </g>
    </g>

    <!-- feet -->
    <rect x="124" y="392" width="72" height="36" rx="18" fill="#f7941e"/>
    <rect x="284" y="392" width="72" height="36" rx="18" fill="#f7941e"/>

    <!-- pot body -->
    <rect x="86" y="234" width="308" height="174" rx="46" fill="#f7941e"/>
    <rect x="86" y="342" width="308" height="66" rx="33" fill="#e8841a" opacity="0.35"/>
    <path d="M122 292c0-20 11-37 28-46" stroke="#fbaf55" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M310 394h28M318 394v-9M128 300h16M136 300v-8" stroke="#ffd9a8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

    <!-- rim and soil -->
    <rect x="68" y="196" width="344" height="58" rx="29" fill="#fba53a"/>
    <path d="M68 234h344v2a29 29 0 0 1-29 18H97a29 29 0 0 1-29-18z" fill="#e8841a" opacity="0.4"/>
    <rect x="98" y="206" width="284" height="36" rx="18" fill="#4e3524"/>
    <rect x="98" y="206" width="284" height="14" rx="7" fill="#3f2a1c"/>
    <circle cx="142" cy="226" r="3.2" fill="#6b4a31"/>
    <circle cx="238" cy="230" r="2.6" fill="#6b4a31"/>
    <circle cx="300" cy="220" r="2.2" fill="#6b4a31"/>
    <path d="M86 212l9 7M95 210l-9 7" stroke="#ffe0b8" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- sprout: one tall stem with two big leaves and two smaller side leaves -->
    <g class="m-leaf m-leaf--1">
        <path d="M238 212V134" stroke="#2e9e4c" stroke-width="8" stroke-linecap="round"/>
        <g transform="translate(238 134) rotate(-40) scale(0.94)">
            <path d="M0 0C10-36 48-56 88-50 84-10 42 14 0 0Z" fill="#35b45c"/>
            <path d="M0 0C42 14 84-10 88-50 72-22 38-8 0 0Z" fill="#2b8f45" opacity="0.4"/>
            <path d="M10-6C36-24 60-38 84-48" stroke="#a9e7b8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
        </g>
    </g>
    <g class="m-leaf m-leaf--2">
        <g transform="translate(242 132) scale(-0.9 0.9) rotate(-44)">
            <path d="M0 0C10-36 48-56 88-50 84-10 42 14 0 0Z" fill="#2fbf5c"/>
            <path d="M0 0C42 14 84-10 88-50 72-22 38-8 0 0Z" fill="#2b8f45" opacity="0.38"/>
            <path d="M10-6C36-24 60-38 84-48" stroke="#bdeec7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
        </g>
    </g>
    <g class="m-leaf m-leaf--3">
        <path d="M206 212c-12-14-20-30-22-46" stroke="#2e9e4c" stroke-width="6" stroke-linecap="round" fill="none"/>
        <g transform="translate(184 166) rotate(-18) scale(0.62)">
            <path d="M0 0C10-36 48-56 88-50 84-10 42 14 0 0Z" fill="#5ccf82"/>
            <path d="M10-6C36-24 60-38 84-48" stroke="#c9f2d3" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
        </g>
    </g>
    <g class="m-leaf m-leaf--4">
        <path d="M284 212c12-12 20-24 24-38" stroke="#2e9e4c" stroke-width="6" stroke-linecap="round" fill="none"/>
        <g transform="translate(308 174) scale(-0.58 0.58) rotate(-22)">
            <path d="M0 0C10-36 48-56 88-50 84-10 42 14 0 0Z" fill="#4cc262"/>
            <path d="M10-6C36-24 60-38 84-48" stroke="#c9f2d3" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
        </g>
    </g>

    <!-- face: one open eye, one happy wink, pink cheeks and an open smile -->
    <g class="m-eye">
        <ellipse cx="172" cy="300" rx="13" ry="18" fill="#1b2a20"/>
        <circle cx="177" cy="291" r="5.6" fill="#ffffff"/>
        <circle cx="165" cy="309" r="2.3" fill="#ffffff" opacity="0.85"/>
    </g>
    <path d="M262 304c10-17 25-19 35-6" stroke="#1b2a20" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="134" cy="332" rx="20" ry="11.5" fill="#f9a8c0" opacity="0.92"/>
    <ellipse cx="346" cy="332" rx="20" ry="11.5" fill="#f9a8c0" opacity="0.92"/>
    <path d="M204 326c3 24 24 35 36 35s33-11 36-35z" fill="#26311f"/>
    <g clip-path="url(#m-mouth)">
        <ellipse cx="240" cy="362" rx="27" ry="15" fill="#f98ba6"/>
    </g>

    <!-- stitched leaf patch sewn on the pot -->
    <g transform="translate(322 352) rotate(7)">
        <rect x="-32" y="-30" width="64" height="60" rx="13" fill="#fffcf0"/>
        <rect x="-32" y="-30" width="64" height="60" rx="13" fill="none" stroke="#cbb088" stroke-width="2.4" stroke-dasharray="5 4"/>
        <path d="M-6 17C-11 3-4-10 11-15 14 1 5 14-6 17Z" fill="#35b45c"/>
        <path d="M-1 11C1 3 5-4 10-9" stroke="#bdeec7" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g>

    <!-- right hand presenting a potted seedling -->
    <g class="m-hold">
        <path d="M392 288h44l-7 37h-30z" fill="#d98b5f"/>
        <rect x="387" y="281" width="54" height="13" rx="6.5" fill="#c4744b"/>
        <path d="M414 281v-25" stroke="#2f8f4e" stroke-width="4" stroke-linecap="round"/>
        <path d="M414 268c-10 0-17-6-17-15 9 0 17 5 17 15Z" fill="#4cc262"/>
        <path d="M414 260c0-10 7-17 16-17 0 9-7 17-16 17Z" fill="#2fbf5c"/>
        <circle cx="414" cy="306" r="17" fill="#f7941e"/>
        <circle cx="408" cy="300" r="5" fill="#fbaf55" opacity="0.8"/>
    </g>
    <path d="M368 278c14 8 26 16 34 22" stroke="#f7941e" stroke-width="31" fill="none" stroke-linecap="round"/>
    <path d="M368 278c14 8 26 16 34 22" stroke="#fbaf55" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6" transform="translate(-3 -5)"/>
</g>

<!-- a few seeds drifting up around the character -->
<g class="m-seeds">
    <ellipse class="m-seed m-seed--1" cx="62" cy="150" rx="5" ry="7.5" transform="rotate(-22 62 150)" fill="#c7a76a" opacity="0.7"/>
    <ellipse class="m-seed m-seed--2" cx="432" cy="132" rx="4.5" ry="6.8" transform="rotate(26 432 132)" fill="#c7a76a" opacity="0.7"/>
    <circle class="m-seed m-seed--3" cx="446" cy="388" r="4" fill="#ffc857" opacity="0.75"/>
</g>
</svg>
