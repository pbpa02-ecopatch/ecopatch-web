<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" role="img" aria-label="Tukar Bibit sedang melambai sambil memegang bungkusan bibit">
<style>
    .hero-char { transform-box: fill-box; transform-origin: 50% 100%; animation: hero-bob 4.6s ease-in-out infinite; }
    .hero-wave { transform-box: fill-box; transform-origin: 95% 97%; animation: hero-wave 2.7s ease-in-out infinite; }
    .hero-frond { transform-box: view-box; }
    .hero-frond--1 { transform-origin: 196px 216px; animation: hero-sway 4.4s ease-in-out infinite; animation-delay: -0.6s; }
    .hero-frond--2 { transform-origin: 248px 216px; animation: hero-sway 4.9s ease-in-out infinite; animation-delay: -2.4s; }
    .hero-frond--3 { transform-origin: 220px 216px; animation: hero-sway 4.1s ease-in-out infinite; animation-delay: -1.4s; }
    .hero-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: hero-blink 5.2s infinite; }
    .hero-gaze { transform-box: fill-box; animation: hero-gaze 7s ease-in-out infinite; }
    .hero-packet { transform-box: fill-box; transform-origin: 20% 88%; animation: hero-packet 3.8s ease-in-out infinite; }
    .hero-seed { transform-box: fill-box; animation: hero-drift 6.4s ease-in-out infinite; }
    .hero-seed--2 { animation-duration: 7.8s; animation-delay: -2.4s; }
    .hero-seed--3 { animation-duration: 5.6s; animation-delay: -3.6s; }
    @keyframes hero-bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
    @keyframes hero-wave { 0%, 100% { rotate: 7deg; } 50% { rotate: -8deg; } }
    @keyframes hero-sway { 0%, 100% { rotate: -2.6deg; } 50% { rotate: 2.6deg; } }
    @keyframes hero-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }
    @keyframes hero-gaze { 0%, 100% { translate: 0 0; } 32% { translate: 2.4px 0; } 68% { translate: -2.4px 0; } }
    @keyframes hero-packet { 0%, 100% { rotate: -2.4deg; } 50% { rotate: 2.6deg; } }
    @keyframes hero-drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }
    @media (prefers-reduced-motion: reduce) {
        .hero-char, .hero-wave, .hero-frond, .hero-eyes, .hero-gaze, .hero-packet, .hero-seed { animation: none; }
    }
</style>

<ellipse cx="220" cy="405" rx="128" ry="14" fill="#22301f" opacity="0.14"/>

<g class="hero-char">
    <!-- leaves -->
    <g class="hero-frond hero-frond--1">
        <path d="M198 220C196 194 190 176 184 160" stroke="#1f9142" stroke-width="7" fill="none" stroke-linecap="round"/>
        <g transform="translate(184 160) scale(-0.62 0.62) rotate(-24)">
            <path d="M0 0C10-34 46-52 84-46 80-10 40 12 0 0Z" fill="#2fbf5c"/>
            <path d="M0 0C40 12 80-10 84-46 70-20 36-6 0 0Z" fill="#1f9142" opacity="0.55"/>
            <path d="M8-5C32-22 54-34 78-44" stroke="#bdeec7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
        </g>
    </g>
    <g class="hero-frond hero-frond--2">
        <path d="M244 220C246 196 252 182 258 168" stroke="#1f9142" stroke-width="7" fill="none" stroke-linecap="round"/>
        <g transform="translate(258 168) scale(0.66 0.66) rotate(-34)">
            <path d="M0 0C10-34 46-52 84-46 80-10 40 12 0 0Z" fill="#2fbf5c"/>
            <path d="M0 0C40 12 80-10 84-46 70-20 36-6 0 0Z" fill="#1f9142" opacity="0.55"/>
            <path d="M8-5C32-22 54-34 78-44" stroke="#bdeec7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
        </g>
    </g>
    <g class="hero-frond hero-frond--3">
        <path d="M220 220C220 182 218 146 220 108" stroke="#1f9142" stroke-width="9" fill="none" stroke-linecap="round"/>
        <g transform="translate(220 108) rotate(-13)">
            <path d="M0 0C10-34 46-52 84-46 80-10 40 12 0 0Z" fill="#2fbf5c"/>
            <path d="M0 0C40 12 80-10 84-46 70-20 36-6 0 0Z" fill="#1f9142" opacity="0.55"/>
            <path d="M8-5C32-22 54-34 78-44" stroke="#bdeec7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
        </g>
        <g transform="translate(220 108) scale(-1 1) rotate(-13)">
            <path d="M0 0C10-34 46-52 84-46 80-10 40 12 0 0Z" fill="#2fbf5c"/>
            <path d="M0 0C40 12 80-10 84-46 70-20 36-6 0 0Z" fill="#1f9142" opacity="0.55"/>
            <path d="M8-5C32-22 54-34 78-44" stroke="#bdeec7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
        </g>
    </g>

    <!-- feet -->
    <rect x="140" y="362" width="60" height="34" rx="17" fill="#e8841a"/>
    <rect x="240" y="362" width="60" height="34" rx="17" fill="#e8841a"/>

    <!-- pot body -->
    <rect x="88" y="236" width="264" height="144" rx="42" fill="#ff9d2e"/>
    <path d="M92 344H348v2a42 42 0 0 1-42 42H134a42 42 0 0 1-42-42Z" fill="#e8841a" opacity="0.5"/>
    <path d="M112 280a36 36 0 0 1 20-32" stroke="#ffd08f" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.75"/>
    <circle cx="112" cy="268" r="3.6" fill="#cf6f10"/>
    <circle cx="330" cy="268" r="3.6" fill="#cf6f10"/>
    <circle cx="114" cy="360" r="3.6" fill="#cf6f10"/>

    <!-- rim and soil -->
    <rect x="66" y="196" width="308" height="54" rx="27" fill="#ffb85c"/>
    <rect x="66" y="224" width="308" height="20" rx="10" fill="#ff9d2e" opacity="0.55"/>
    <rect x="94" y="202" width="252" height="30" rx="15" fill="#5b3a24"/>
    <rect x="94" y="202" width="252" height="12" rx="6" fill="#47301e"/>
    <circle cx="132" cy="218" r="3.4" fill="#7a5233"/>
    <circle cx="238" cy="220" r="3" fill="#7a5233"/>
    <circle cx="286" cy="215" r="2.6" fill="#7a5233"/>

    <!-- stitched leaf patch sewn on the pot, just like the mascot sheet -->
    <g transform="translate(290 342) rotate(8)">
        <rect x="-27" y="-27" width="54" height="54" rx="14" fill="#fbf0d4"/>
        <rect x="-27" y="-27" width="54" height="54" rx="14" fill="none" stroke="#8a6a4a" stroke-width="2" stroke-dasharray="5 4"/>
        <path d="M-7 15C-11 2-4-9 9-13 11 2 4 12-7 15Z" fill="#2fbf5c"/>
        <path d="M-2 10C0 2 4-4 8-8" stroke="#bdeec7" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g>

    <!-- face -->
    <g class="hero-eyes"><g class="hero-gaze">
        <ellipse cx="164" cy="282" rx="11" ry="16" fill="#22301f"/>
        <circle cx="168" cy="274" r="4.5" fill="#fff"/>
        <circle cx="160" cy="289" r="2" fill="#fff" opacity="0.8"/>
        <ellipse cx="276" cy="282" rx="11" ry="16" fill="#22301f"/>
        <circle cx="280" cy="274" r="4.5" fill="#fff"/>
        <circle cx="272" cy="289" r="2" fill="#fff" opacity="0.8"/>
    </g></g>
    <ellipse cx="130" cy="310" rx="17" ry="10.5" fill="#ff8fa8" opacity="0.85"/>
    <ellipse cx="310" cy="310" rx="17" ry="10.5" fill="#ff8fa8" opacity="0.85"/>
    <path d="M196 304Q220 330 244 304Z" fill="#22301f" stroke="#22301f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M204 315Q220 325 236 315Q220 307 204 315Z" fill="#ff8fa8"/>

    <!-- waving arm -->
    <g class="hero-wave">
        <path d="M100 290Q60 270 54 224" stroke="#ff9d2e" stroke-width="26" fill="none" stroke-linecap="round"/>
        <path d="M100 290Q60 270 54 224" stroke="#ffb85c" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6" transform="translate(-3 -3)"/>
        <circle cx="54" cy="204" r="18" fill="#ff9d2e"/>
        <circle cx="48" cy="198" r="5.5" fill="#ffb85c" opacity="0.75"/>
    </g>

    <!-- right arm holding a seed packet (packet first, then the hand grips it) -->
    <g class="hero-packet" transform="translate(388 290) rotate(8)">
        <rect x="-29" y="-25" width="58" height="50" rx="10" fill="#fff8e2"/>
        <rect x="-29" y="-25" width="58" height="50" rx="10" fill="none" stroke="#c7a76a" stroke-width="2.5"/>
        <rect x="-23" y="-19" width="46" height="11" rx="4" fill="#2fbf5c"/>
        <path d="M0 20V4" stroke="#2f8f4e" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M0 11C-8 11-13 6-13-1-5-1 0 4 0 11Z" fill="#5ccf82"/>
        <path d="M0 7C0-1 5-6 13-6 13 2 8 7 0 7Z" fill="#2fbf5c"/>
        <path d="M-18 16H18" stroke="#c7a76a" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
    </g>
    <path d="M340 292Q360 300 366 314" stroke="#ff9d2e" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M340 292Q360 300 366 314" stroke="#ffb85c" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6" transform="translate(-3 -4)"/>
    <circle cx="366" cy="314" r="15" fill="#ff9d2e"/>
    <circle cx="361" cy="309" r="4.5" fill="#ffb85c" opacity="0.75"/>
</g>

<g class="hero-seeds">
    <ellipse class="hero-seed hero-seed--1" cx="54" cy="156" rx="5" ry="7.5" transform="rotate(-20 54 156)" fill="#c7a76a" opacity="0.9"/>
    <ellipse class="hero-seed hero-seed--2" cx="394" cy="128" rx="4.5" ry="6.8" transform="rotate(24 394 128)" fill="#c7a76a" opacity="0.8"/>
    <circle class="hero-seed hero-seed--3" cx="408" cy="362" r="4" fill="#ffc857"/>
</g>
</svg>
