<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 420 410" role="img" aria-label="Tukar Bibit, maskot Seed Exchange" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
    .m-float { animation: m-float 5.4s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .m-wave  { transform-box: fill-box; transform-origin: 100% 100%; animation: m-wave 2.6s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .m-hold  { transform-box: fill-box; transform-origin: 0% 100%; animation: m-hold 3.8s ease-in-out infinite; }
    .m-leaf  { transform-box: fill-box; transform-origin: 50% 100%; animation: m-sway 4.8s ease-in-out infinite; }
    .m-eye   { transform-box: fill-box; transform-origin: 50% 50%; animation: m-blink 5.2s infinite; }
    @keyframes m-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
    @keyframes m-wave  { 0%, 100% { rotate: -5deg; } 50% { rotate: 9deg; } }
    @keyframes m-hold  { 0%, 100% { rotate: -1.5deg; } 50% { rotate: 2deg; } }
    @keyframes m-sway  { 0%, 100% { rotate: -1.6deg; } 50% { rotate: 1.8deg; } }
    @keyframes m-blink { 0%, 92%, 100% { transform: scaleY(1); } 95%, 96.5% { transform: scaleY(0.1); } }
    @media (prefers-reduced-motion: reduce) { .m-float, .m-wave, .m-hold, .m-leaf, .m-eye { animation: none; } }
</style>
<ellipse cx="200" cy="362" rx="122" ry="14" fill="#22301f" opacity="0.14"/>
<g class="m-float">
    <!-- left arm: raised and waving -->
    <g class="m-wave">
        <path d="M92 262 Q56 244 60 200" stroke="#ff9d2e" stroke-width="26" stroke-linecap="round" fill="none"/>
        <path d="M92 262 Q56 244 60 200" stroke="#ffb85c" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6" transform="translate(-3 -3)"/>
        <circle cx="60" cy="198" r="17" fill="#ff9d2e"/>
        <circle cx="55" cy="193" r="5" fill="#ffb85c" opacity="0.75"/>
    </g>
    <!-- right arm: reaching out to hold the seed packet -->
    <path d="M308 266 Q346 274 352 240" stroke="#ff9d2e" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M308 266 Q346 274 352 240" stroke="#ffb85c" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6" transform="translate(-3 -3)"/>
    <rect x="124" y="332" width="54" height="28" rx="14" fill="#e8841a"/>
    <rect x="222" y="332" width="54" height="28" rx="14" fill="#e8841a"/>
    <g class="m-leaf">
        <path d="M152 194 C150 174 144 160 138 146" stroke="#1f9142" stroke-width="7" stroke-linecap="round" fill="none"/>
        <g transform="translate(138 146) scale(-0.66 0.66) rotate(-34)"><path d="M0 0 C10 -34 46 -52 84 -46 C80 -10 40 12 0 0 Z" fill="#2fbf5c"/><path d="M0 0 C40 12 80 -10 84 -46 C70 -20 36 -6 0 0 Z" fill="#1f9142" opacity="0.55"/><path d="M8 -5 C32 -22 54 -34 78 -44" stroke="#bdeec7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/></g>
        <path d="M250 194 C254 176 262 164 270 150" stroke="#1f9142" stroke-width="7" stroke-linecap="round" fill="none"/>
        <g transform="translate(270 150) scale(0.7 0.7) rotate(-44)"><path d="M0 0 C10 -34 46 -52 84 -46 C80 -10 40 12 0 0 Z" fill="#2fbf5c"/><path d="M0 0 C40 12 80 -10 84 -46 C70 -20 36 -6 0 0 Z" fill="#1f9142" opacity="0.55"/><path d="M8 -5 C32 -22 54 -34 78 -44" stroke="#bdeec7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/></g>
        <path d="M200 194 C200 160 197 130 200 98" stroke="#1f9142" stroke-width="9" stroke-linecap="round" fill="none"/>
        <g transform="translate(200 98) scale(1.04 1.04) rotate(-26)"><path d="M0 0 C10 -34 46 -52 84 -46 C80 -10 40 12 0 0 Z" fill="#2fbf5c"/><path d="M0 0 C40 12 80 -10 84 -46 C70 -20 36 -6 0 0 Z" fill="#1f9142" opacity="0.55"/><path d="M8 -5 C32 -22 54 -34 78 -44" stroke="#bdeec7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/></g>
        <g transform="translate(200 98) scale(-1.04 1.04) rotate(-26)"><path d="M0 0 C10 -34 46 -52 84 -46 C80 -10 40 12 0 0 Z" fill="#2fbf5c"/><path d="M0 0 C40 12 80 -10 84 -46 C70 -20 36 -6 0 0 Z" fill="#1f9142" opacity="0.55"/><path d="M8 -5 C32 -22 54 -34 78 -44" stroke="#bdeec7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/></g>
    </g>
    <!-- body, rim and soil -->
    <rect x="86" y="196" width="228" height="150" rx="40" fill="#ff9d2e"/>
    <path d="M90 304 H310 V306 a40 40 0 0 1 -40 40 H130 a40 40 0 0 1 -40 -40 Z" fill="#e8841a" opacity="0.5"/>
    <path d="M106 240 a34 34 0 0 1 20 -30" stroke="#ffd08f" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.75"/>
    <circle cx="110" cy="230" r="3.6" fill="#cf6f10"/><circle cx="290" cy="230" r="3.6" fill="#cf6f10"/><circle cx="110" cy="326" r="3.6" fill="#cf6f10"/>
    <rect x="78" y="172" width="244" height="46" rx="23" fill="#ffb85c"/>
    <rect x="78" y="200" width="244" height="18" rx="9" fill="#ff9d2e" opacity="0.6"/>
    <rect x="96" y="178" width="208" height="26" rx="13" fill="#5b3a24"/>
    <rect x="96" y="178" width="208" height="11" rx="5.5" fill="#47301e"/>
    <circle cx="132" cy="196" r="3.4" fill="#7a5233"/><circle cx="238" cy="198" r="3" fill="#7a5233"/><circle cx="280" cy="193" r="2.6" fill="#7a5233"/>
    <!-- face: one open eye, one wink, cheeks and an open smile -->
    <g class="m-eye">
        <ellipse cx="158" cy="252" rx="11" ry="15" fill="#22301f"/>
        <circle cx="162" cy="245" r="4.4" fill="#fff"/>
        <circle cx="154" cy="257" r="2" fill="#fff" opacity="0.8"/>
    </g>
    <path d="M230 256 Q242 238 254 256" stroke="#22301f" stroke-width="6" stroke-linecap="round" fill="none"/>
    <ellipse cx="128" cy="276" rx="16" ry="10" fill="#ff8fa8" opacity="0.85"/>
    <ellipse cx="272" cy="276" rx="16" ry="10" fill="#ff8fa8" opacity="0.85"/>
    <path d="M180 270 Q200 304 220 270 Z" fill="#22301f" stroke="#22301f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M190 285 Q200 295 210 285 Q200 278 190 285 Z" fill="#ff8fa8"/>
    <g transform="translate(268 312) rotate(8)">
        <rect x="-27" y="-23" width="54" height="46" rx="11" fill="#fdedc9"/>
        <rect x="-21" y="-17" width="42" height="34" rx="8" fill="none" stroke="#59684f" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
        <path d="M-9 9 C-9 -5 2 -12 11 -12 C11 -2 4 9 -9 9 Z" fill="#2fbf5c"/>
        <path d="M-7 7 L7 -8" stroke="#bdeec7" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- seed packet in the right hand -->
    <g class="m-hold">
        <g transform="translate(364 200) rotate(9)">
            <rect x="-22" y="-32" width="44" height="62" rx="9" fill="#2a8f4b"/>
            <rect x="-17" y="-27" width="34" height="52" rx="6" fill="#f3f9ec"/>
            <rect x="-17" y="-27" width="34" height="13" rx="6" fill="#2fbf5c"/>
            <path d="M-6 17 C-6 6 2 -2 11 -3 C11 7 4 16 -6 17 Z" fill="#2fbf5c"/>
            <path d="M-4 15 L7 1" stroke="#bdeec7" stroke-width="2" stroke-linecap="round"/>
        </g>
        <circle cx="352" cy="238" r="17" fill="#ff9d2e"/>
        <circle cx="347" cy="233" r="5" fill="#ffb85c" opacity="0.75"/>
    </g>
</g>
</svg>
