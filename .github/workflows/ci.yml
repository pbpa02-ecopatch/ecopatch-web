# Runs on every pull request to dev/main and on every push to dev/main:
# the project's checks, so a broken change is seen before it is merged.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI never needs real secrets: tests run on SQLite with the development defaults
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test --parallel 4
